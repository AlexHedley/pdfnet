<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title description">
  <title id="title">PdfNet — PDF merging for .NET</title>
  <desc id="description">One-page overview of the PdfNet library and its apps.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102c24"/>
      <stop offset="1" stop-color="#26734c"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#deeee2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="15" stdDeviation="14" flood-color="#173f2b" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1080" height="1350" fill="#f4f7f4"/>
  <path d="M0 0h1080v616H0z" fill="url(#hero)"/>
  <circle cx="1010" cy="35" r="270" fill="#a1cfac" opacity=".12"/>
  <g transform="translate(82 74)">
    <rect width="66" height="66" rx="17" fill="#f3fbf5"/>
    <path d="M10 16h12l5 5v16H10zM10 38h12l5 5v12H10z" fill="#d0ead7"/>
    <path d="M22 16v6h5M22 38v6h5M13 24h8M13 29h8M13 46h8M13 51h8" fill="none" stroke="#26734c" stroke-linecap="round" stroke-width="2"/>
    <path d="M27 28h5c7 0 7 6 13 6h2M27 47h5c7 0 7-6 13-6h2" fill="none" stroke="#bce0c7" stroke-linecap="round" stroke-width="2"/>
    <path d="m45 31 4 3-4 3m0 7 4-3" fill="none" stroke="#bce0c7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
    <path d="M41 13h12l7 7v35H41z" fill="#26734c"/>
    <path d="M53 13v8h7M45 29h9M45 34h9M45 39h9M45 44h9" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
    <text x="84" y="49" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="750">PdfNet</text>
  </g>
  <text x="82" y="276" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="78" font-weight="750" letter-spacing="-3">PDF merging,</text>
  <text x="82" y="366" fill="#d0ead7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="78" font-weight="750" letter-spacing="-3">without friction.</text>
  <text x="88" y="430" fill="#e1efe4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25">A focused .NET 10 library and practical apps.</text>
  <g transform="translate(700 195)" filter="url(#shadow)">
    <rect x="35" y="22" width="230" height="292" rx="19" fill="#c6dfcd" opacity=".75" transform="rotate(9 150 168)"/>
    <rect width="230" height="292" rx="19" fill="url(#paper)"/>
    <path d="M160 0v72h70" fill="#c8e4d0"/>
    <path d="M43 112h137M43 144h137M43 176h104" stroke="#729b7b" stroke-linecap="round" stroke-width="12"/>
    <circle cx="184" cy="242" r="51" fill="#26734c"/>
    <path d="m159 242 18 18 33-37" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="11"/>
  </g>
  <text x="82" y="704" fill="#193728" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="35" font-weight="750">One core. Multiple workflows.</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(82 758)">
      <rect width="434" height="170" rx="18" fill="#fff"/>
      <circle cx="47" cy="49" r="23" fill="#e4f1e7"/>
      <path d="M37 49h20M47 39v20" stroke="#26734c" stroke-linecap="round" stroke-width="4"/>
      <text x="84" y="56" fill="#1e3528" font-size="25" font-weight="700">Merge API</text>
      <text x="34" y="108" fill="#617267" font-size="18">Paths, byte arrays, or streams.</text>
      <text x="34" y="137" fill="#617267" font-size="18">Pages and metadata stay predictable.</text>
    </g>
    <g transform="translate(564 758)">
      <rect width="434" height="170" rx="18" fill="#fff"/>
      <circle cx="47" cy="49" r="23" fill="#e4f1e7"/>
      <path d="M37 43h20M37 50h20M37 57h14" stroke="#26734c" stroke-linecap="round" stroke-width="3"/>
      <text x="84" y="56" fill="#1e3528" font-size="25" font-weight="700">Desktop + terminal</text>
      <text x="34" y="108" fill="#617267" font-size="18">TUI, WPF, WinForms, and folders.</text>
      <text x="34" y="137" fill="#617267" font-size="18">Choose files or batch a directory.</text>
    </g>
    <g transform="translate(82 952)">
      <rect width="434" height="170" rx="18" fill="#fff"/>
      <circle cx="47" cy="49" r="23" fill="#e4f1e7"/>
      <circle cx="47" cy="49" r="13" fill="none" stroke="#26734c" stroke-width="3"/>
      <path d="M34 49h26M47 36c5 7 5 19 0 26M47 36c-5 7-5 19 0 26" fill="none" stroke="#26734c" stroke-width="2"/>
      <text x="84" y="56" fill="#1e3528" font-size="25" font-weight="700">Browser-local</text>
      <text x="34" y="108" fill="#617267" font-size="18">Standalone Blazor WebAssembly app.</text>
      <text x="34" y="137" fill="#617267" font-size="18">PDF files are merged on-device.</text>
    </g>
    <g transform="translate(564 952)">
      <rect width="434" height="170" rx="18" fill="#fff"/>
      <circle cx="47" cy="49" r="23" fill="#e4f1e7"/>
      <path d="m35 49 8 8 16-18" fill="none" stroke="#26734c" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
      <text x="84" y="56" fill="#1e3528" font-size="25" font-weight="700">Carefully scoped</text>
      <text x="34" y="108" fill="#617267" font-size="18">Dependency-free PDF merging.</text>
      <text x="34" y="137" fill="#617267" font-size="18">Clear failure handling and tests.</text>
    </g>
  </g>
  <rect x="82" y="1173" width="916" height="2" fill="#d8e2da"/>
  <text x="82" y="1235" fill="#26734c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750">PdfNet</text>
  <text x="82" y="1271" fill="#617267" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">PDF merging for .NET 10</text>
  <text x="998" y="1237" fill="#617267" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" text-anchor="end">github.com/alexhedley/pdfnet</text>
</svg>
